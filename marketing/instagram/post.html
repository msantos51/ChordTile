<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:R;font-weight:400;src:url(../../node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2)}
@font-face{font-family:R;font-weight:500;src:url(../../node_modules/@fontsource/roboto/files/roboto-latin-500-normal.woff2)}
@font-face{font-family:R;font-weight:700;src:url(../../node_modules/@fontsource/roboto/files/roboto-latin-700-normal.woff2)}
@font-face{font-family:R;font-weight:900;src:url(../../node_modules/@fontsource/roboto/files/roboto-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(../../node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;font-family:R,sans-serif;background:#0b0b0d;color:#f5f5f6;overflow:hidden;position:relative}
.top{padding:56px 80px 0}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px;letter-spacing:-.5px}
.brand svg{width:56px;height:56px}
.kicker{margin-top:40px;color:#ff4d5a;font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase}
h1{margin-top:20px;font-weight:900;font-size:84px;line-height:.98;letter-spacing:-3px}
h1 em{font-style:normal;color:#e5222b}
.sub{margin-top:20px;font-size:30px;line-height:1.35;color:#bfc0c6;max-width:880px}
/* player card */
.card{margin:36px 80px 0;background:#141417;border:2px solid rgba(255,255,255,.14);border-radius:28px;padding:28px 34px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;justify-content:space-between}
.sec{font-weight:700;font-size:22px;letter-spacing:2.5px;color:#bfc0c6}
.loopbadge{display:flex;align-items:center;gap:10px;background:#e5222b;color:#fff;border-radius:999px;padding:9px 20px 9px 16px;font-weight:700;font-size:22px}
.loopbadge svg{width:26px;height:26px}
.tiles{display:flex;gap:16px;margin-top:20px}
.t{flex:1;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:M;font-weight:700;font-size:42px;color:#121212;box-shadow:inset 0 -7px 0 rgba(0,0,0,.18)}
.t.on{outline:5px solid #fff;outline-offset:4px}
.tab{margin-top:24px;height:100px;position:relative}
.tab i{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.22)}
.tab b{position:absolute;font-family:M;font-size:20px;color:#f5f5f6;background:#141417;padding:0 5px;transform:translate(-50%,-50%)}
.tab u{position:absolute;top:0;width:2px;height:100px;background:rgba(255,255,255,.4)}
.tab .head{position:absolute;top:-8px;bottom:-8px;width:4px;background:#ff3a3a;border-radius:2px;box-shadow:0 0 18px #ff3a3a}
.speeds{display:flex;gap:12px;margin-top:22px}
.sp{flex:1;text-align:center;padding:12px 0;border-radius:999px;border:2px solid rgba(255,255,255,.24);font-weight:700;font-size:25px;color:#bfc0c6}
.sp.on{background:#f5f5f6;color:#0b0b0d;border-color:#f5f5f6}
/* features */
.feats{display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;margin:34px 80px 0}
.f{display:flex;align-items:center;gap:16px;font-size:29px;font-weight:500}
.f span{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(229,34,43,.16);display:flex;align-items:center;justify-content:center}
.f svg{width:28px;height:28px;stroke:#ff4d5a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* cta */
.cta{position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(120deg,#c8102e,#e5222b 60%,#ff3a3a);display:flex;align-items:center;justify-content:space-between;padding:0 80px}
.cta .u{font-weight:900;font-size:50px;letter-spacing:-1px;color:#fff}
.cta .p{background:#fff;color:#c8102e;font-weight:700;font-size:28px;padding:18px 30px;border-radius:999px}
</style></head>
<body>
<div class="top">
  <div class="brand"><svg viewBox="16 16 224 224"><path fill="#e5222b" fill-rule="evenodd" d="M76 16H180A60 60 0 0 1 240 76V180A60 60 0 0 1 180 240H76A60 60 0 0 1 16 180V76A60 60 0 0 1 76 16ZM203 104A47 47 0 0 0 156 57H108A47 47 0 0 0 61 104V152A47 47 0 0 0 108 199H156A47 47 0 0 0 203 152H165A9 9 0 0 1 156 161H108A9 9 0 0 1 99 152V104A9 9 0 0 1 108 95H156A9 9 0 0 1 165 104Z"/></svg>ChordTile</div>
  <div class="kicker" data-k="kicker"></div>
  <h1 data-k="h1"></h1>
  <p class="sub" data-k="sub"></p>
</div>

<div class="card">
  <div class="row"><div class="sec" data-k="sec"></div>
    <div class="loopbadge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span data-k="loop"></span></div></div>
  <div class="tiles">
    <div class="t" style="background:#fda19e">C</div>
    <div class="t on" style="background:#999eff">Am</div>
    <div class="t" style="background:#a6cc80">F</div>
    <div class="t" style="background:#5cd5c7">G</div>
  </div>
  <div class="tab" id="tab"></div>
  <div class="speeds">
    <div class="sp">25%</div><div class="sp on">50%</div><div class="sp">75%</div><div class="sp">100%</div><div class="sp">125%</div>
  </div>
</div>

<div class="feats">
  <div class="f"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M10 2h4"/></svg></span><b data-k="f1" style="font-weight:500"></b></div>
  <div class="f"><span><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></span><b data-k="f2" style="font-weight:500"></b></div>
  <div class="f"><span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><b data-k="f3" style="font-weight:500"></b></div>
  <div class="f"><span><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><b data-k="f4" style="font-weight:500"></b></div>
</div>

<div class="cta"><div class="u">chordtile.com</div><div class="p" data-k="cta"></div></div>

<script>
const T={
 en:{kicker:"Learning from tabs?",h1:"Too fast to<br>follow? <em>Slow it<br>down. Loop it.</em>",
  sub:"Open your Guitar Pro file and practise one section at a time — at your speed, until it sticks.",
  sec:"CHORUS",loop:"Looping",f1:"Slow down to 25%",f2:"Loop any section",f3:"Chords as colour tiles",f4:"Play along with the band",cta:"Try it free"},
 pt:{kicker:"Aprendes pelas tabs?",h1:"Rápido demais?<br><em>Abranda.<br>Repete em loop.</em>",
  sub:"Abre o teu ficheiro Guitar Pro e pratica uma secção de cada vez — à tua velocidade, até ficar.",
  sec:"REFRÃO",loop:"Em loop",f1:"Abranda até 25%",f2:"Loop de cada secção",f3:"Acordes em cores",f4:"Toca com a banda",cta:"Experimenta grátis"}};
const L=T[new URLSearchParams(location.search).get('lang')||'en'];
document.querySelectorAll('[data-k]').forEach(e=>e.innerHTML=L[e.dataset.k]);
// mini tab: 6 strings with a few fret numbers and a playhead
const tab=document.getElementById('tab');
for(let s=0;s<6;s++){const i=document.createElement('i');i.style.top=(s*20)+'px';tab.appendChild(i);}
// string 0 = high e ... 5 = low E. Open shapes picked as arpeggios, one bar under each tile.
// C x32010 | Am x02210 | F xx3211 | G 320003
const bars=[[[4,3],[3,2],[2,0],[1,1],[0,0]],[[4,0],[3,2],[2,2],[1,1],[0,0]],[[3,3],[2,2],[1,1],[0,1]],[[5,3],[4,2],[3,0],[2,0],[1,0],[0,3]]];
const notes=[];
bars.forEach((bar,k)=>{const step=21/bar.length;bar.forEach(([st,fr],j)=>notes.push([k*25+3+step*(j+.5),st,String(fr)]));});
[25,50,75].forEach(x=>{const u=document.createElement('u');u.style.left=x+'%';tab.appendChild(u);});
notes.forEach(([x,s,f])=>{const b=document.createElement('b');b.textContent=f;b.style.left=x+'%';b.style.top=(s*20)+'px';tab.appendChild(b);});
const h=document.createElement('div');h.className='head';h.style.left='39.5%';tab.appendChild(h);
</script>
</body></html>
