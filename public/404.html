<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · ChordTile</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #121212; --soft: #555; --red: #c8102e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2024; --ink: #f4f2f0; --soft: #b5b2ae; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 420px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--soft); margin: 0 0 24px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page does not exist or has moved.</p>
  <a href="/">Go to ChordTile</a>
</main>
</body>
</html>
