name: CI

# Só manual, para não gastar minutos do GitHub Actions: os testes correm no computador
# (`npm run check`) e o "Publicar no GitHub Pages" volta a corrê-los antes de publicar.
on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
